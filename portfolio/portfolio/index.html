<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marc Bishara - Embedded Systems Engineer</title>
  <meta name="description" content="Marc Bishara, engineering student and application engineer apprentice at STMicroelectronics. Projects in embedded systems, electronics, and software.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="cv-page">
  <header class="cv-masthead">
    <a class="mark" id="cvLogo" href="index.html" aria-label="Marc Bishara, home">MB</a>
    <div class="cv-identity">
      <p id="cvHeadline" class="cv-headline"></p>
      <h1 id="cvName">Marc Bishara</h1>
      <p id="cvSummary" class="cv-summary"></p>
    </div>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" data-language="en" aria-pressed="true" aria-label="English">EN</button>
      <button type="button" data-language="fr" aria-pressed="false" aria-label="Français">FR</button>
    </div>
  </header>

  <main class="cv-main">
    <section class="cv-contact" aria-labelledby="cvContactTitle">
      <h2 id="cvContactTitle">Contact</h2>
      <div id="cvContacts" class="cv-contact-links"></div>
      <a id="cvPdf" class="cv-pdf" href="assets/French%20%26%20English%20CV.pdf" target="_blank" rel="noopener noreferrer">Open bilingual CV (PDF)</a>
    </section>
    <div class="cv-layout">
      <aside class="cv-sidebar">
        <section class="cv-section" aria-labelledby="educationTitle">
          <h2 id="educationTitle">Education</h2>
          <div id="educationList" class="cv-entry-list"></div>
        </section>
        <section class="cv-section" aria-labelledby="skillsTitle">
          <h2 id="skillsTitle">Skills</h2>
          <div id="skillGroups"></div>
        </section>
        <section class="cv-section" aria-labelledby="languagesTitle">
          <h2 id="languagesTitle">Languages and interests</h2>
          <h3 id="languageHeading">Languages</h3>
          <ul id="languageList" class="cv-plain-list"></ul>
          <h3 id="interestsHeading">Interests</h3>
          <ul id="interestList" class="cv-plain-list"></ul>
        </section>
      </aside>
      <div class="cv-primary">
        <section class="cv-section" aria-labelledby="experienceTitle">
          <h2 id="experienceTitle">Experience</h2>
          <div id="experienceList" class="cv-entry-list"></div>
        </section>
        <section class="cv-section" aria-labelledby="projectsTitle">
          <h2 id="projectsTitle">Projects</h2>
          <div id="projectsList" class="cv-entry-list"></div>
        </section>
        <section class="cv-section" aria-labelledby="leadershipTitle">
          <h2 id="leadershipTitle">Leadership and recognition</h2>
          <div id="leadershipList" class="cv-entry-list"></div>
        </section>
        <section class="cv-section" aria-labelledby="aboutTitle">
          <h2 id="aboutTitle">About</h2>
          <div id="aboutText" class="cv-about"></div>
        </section>
      </div>
    </div>
  </main>

  <footer><p id="cvFooter">© 2026 Marc Bishara</p></footer>
  <script src="js/data.js"></script>
  <script src="js/cv.js"></script>
</body>
</html>
