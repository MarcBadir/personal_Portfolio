<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project and experience details from Marc Bishara's portfolio.">
  <title>Portfolio details - Marc Bishara</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Noto+Sans+Mongolian:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="detail-page">
  <a class="skip" href="#detailContent">Skip to details</a>
  <header class="detail-header">
    <a class="mark" href="index.html" aria-label="Marc Bishara, home">MB</a>
    <a id="detailBack" class="detail-back" href="index.html">Back to CV</a>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" data-language="en" aria-pressed="true" aria-label="English">EN</button>
      <button type="button" data-language="fr" aria-pressed="false" aria-label="Français">FR</button>
    </div>
  </header>
  <main class="detail-main">
    <p id="detailNotFound" class="detail-not-found" hidden></p>
    <article id="detailContent" class="detail-content" hidden>
      <p id="detailCategory" class="detail-category"></p>
      <h1 id="detailTitle"></h1>
      <p id="detailSubtitle" class="detail-subtitle"></p>
      <div class="detail-meta">
        <p id="detailDate"></p>
        <p id="detailLocation"></p>
      </div>
      <p id="detailDescription" class="detail-description" hidden></p>
      <div id="detailEducationLinks" class="detail-links"></div>
      <section id="detailDetailsSection" class="detail-section">
        <h2 id="detailDetailsTitle"></h2>
        <ul id="detailBullets" class="detail-bullets"></ul>
      </section>
      <section id="detailHighlightsSection" class="detail-section">
        <h2 id="detailHighlightsTitle"></h2>
        <ul id="detailHighlights" class="detail-bullets"></ul>
      </section>
      <section id="detailResourcesSection" class="detail-section">
        <h2 id="detailResourcesTitle"></h2>
        <div id="detailResources" class="detail-resources"></div>
      </section>
    </article>
  </main>
  <footer><p>© <span id="detailYear"></span> Marc Bishara</p></footer>
  <script src="js/data.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
