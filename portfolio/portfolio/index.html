<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marc Bishara - Embedded Systems Engineer</title>
  <meta name="description" content="Marc Bishara, engineering student and application engineer apprentice at STMicroelectronics. Projects in embedded systems, electronics, and software.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#work">Skip to projects</a>
  <header class="top">
    <a class="mark" href="#top" aria-label="Marc Bishara, home">MB</a>
    <nav aria-label="Main">
      <a href="#experience">Experience</a>
      <a href="#work">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#education">Education</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 id="typed"></h1>
      <p class="lede" id="summary"></p>
      <p class="cta">
        <a class="btn" href="#work">Explore my projects</a>
        <a class="btn ghost" href="#contact">Get in touch</a>
      </p>
    </section>

    <section id="experience" class="block">
      <h2>Experience</h2>
      <div class="entry-list" id="experienceList"></div>
    </section>

    <section id="work" class="block">
      <h2>Projects</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter projects by technology"></div>
      <div class="grid" id="projects"></div>
    </section>

    <section id="skills" class="block">
      <h2>Skills</h2>
      <div class="skills" id="skillList"></div>
    </section>

    <section id="about" class="block narrow">
      <h2>About</h2>
      <p id="aboutText"></p>
    </section>

    <section id="education" class="block">
      <h2>Education</h2>
      <div class="entry-list" id="educationList"></div>
    </section>

    <section id="languages" class="block">
      <h2>Languages and interests</h2>
      <div class="skills">
        <div>
          <h3>Languages</h3>
          <ul class="plain-list" id="languageList"></ul>
        </div>
        <div>
          <h3>Interests</h3>
          <ul class="plain-list" id="interestList"></ul>
        </div>
      </div>
    </section>

    <section id="contact" class="block narrow">
      <h2>Contact</h2>
      <p id="contactNote"></p>
      <p class="links" id="links"></p>
    </section>
  </main>

  <footer><p>© <span id="year"></span> Marc Bishara</p></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
